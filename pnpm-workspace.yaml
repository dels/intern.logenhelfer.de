onlyBuiltDependencies:
  - esbuild
publishBranch: main
packages:
  - app
  - api
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  msw: true
  prisma: true
minimumReleaseAgeExclude:
  - '@types/supertest@7.2.1'
  - brace-expansion@2.1.2 || 5.0.8
  - js-yaml@4.3.0
  - fast-uri@3.1.4
  - find-my-way@9.6.1
  - react-router@8.3.0
  - postcss@8.5.18
  - valibot@1.4.2

  /api/v1/members/{uuid}/mfa/reset:
    post:
      operationId: resetMemberMfa
      summary: Admin-driven MFA reset - wipes every enrolled method, revokes sessions
      description: >-
        Deletes all of the target's MFA credential rows (TOTP, email,
        passkey, backup codes, trusted devices), mints (but does not email)
        a password-reset token, revokes every outstanding refresh-token
        family for the target, and writes a server-side mfa_reset_events
        audit row attributing the reset to the calling admin. Rejected
        outright - before any target lookup - whenever the caller is
        impersonating (regardless of target), and whenever the target is
        the caller's own account, closing two distinct ways a hijacked
        Admin session could otherwise wipe its own or its real actor's MFA
        under cover of this endpoint (see members.ts's own doc comment on
        this handler for the full threat model).
      parameters:
        - name: uuid
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: MFA reset; refresh-token families revoked }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

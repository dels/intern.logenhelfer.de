onlyBuiltDependencies:
  - esbuild
publishBranch: main
packages:
  - app
  - api
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  # msgpackr-extract is an optional native-acceleration add-on for msgpackr
  # (a transitive dep pulled in by bullmq/ioredis). Denied here rather than
  # approved: it's optional (pure-JS fallback works fine, and this module's
  # own tests never need it), and this repo doesn't run unreviewed
  # postinstall scripts without an explicit reason to.
  msgpackr-extract: false
  msw: true
  prisma: true
minimumReleaseAgeExclude:
  - '@types/supertest@7.2.1'
  - brace-expansion@2.1.2 || 2.1.3 || 2.1.5 || 2.1.6 || 2.1.7 || 5.0.8 || 5.0.10 || 5.0.11 || 5.0.12
  - js-yaml@4.3.1 || 4.3.2
  - fast-uri@3.1.5 || 3.1.6 || 3.1.7 || 3.1.8
  - find-my-way@9.7.0
  - react-router@8.3.0
  - postcss@8.5.25
  - valibot@1.4.2
  - undici@7.29.0 || 7.29.1
  - ip-address@10.3.1 || 10.5.1 || 10.7.1
  - dompurify@3.4.13 || 3.4.16
  - nanoid@3.3.18
  - deepmerge-ts@8.0.0
  - mysql2@3.22.0 || 3.23.1
  - qs@6.15.4 || 6.16.0
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11'
  - sharp@0.35.4
  - nodemailer@9.1.0 || 9.1.1 || 10.0.2 || 10.0.6
  - multer@2.3.0 || 2.4.0
  - source-map-js@1.2.2
  - proxy-addr@2.0.8
# Security-patch overrides for transitive deps flagged by `pnpm audit`/Dependabot
# (2026-08-05) — pin to the lowest version that fixes the advisory, staying
# within the same major to avoid an unreviewed breaking upgrade. Drop an
# entry once the direct dependency that pulls it in bumps past this version
# on its own.
overrides:
  js-yaml: 4.3.1
  find-my-way: 9.7.0
  postcss: 8.5.25
  valibot: 1.4.2
  undici: 7.29.0
  fast-uri: 3.1.5
  ip-address: 10.3.1

      parameters:
        - name: directory_slug
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Files in a directory the caller is permitted to see
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachedFileList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAttachedFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, directory_slug]
              properties:
                file: { type: string, format: binary }
                directory_slug: { type: string }
                # Deliberately untyped (no `type: array`), unlike the PATCH
                # endpoint's JSON-body role_ids below. FileForm/api.ts sends
                # selected roles as repeated `role_ids[]` multipart fields;
                # multer (via append-field) turns even a single occurrence
                # into a one-element array. express-openapi-validator's own
                # multipart handling (openapi.request.validator.js's
                # multipartNested) JSON.parses any multipart field whose
                # declared type is array/object - which for a one-element
                # array coerces to its string join first (['5'] -> '5'), then
                # parses that as the bare number 5, silently replacing the
                # array with a scalar and failing "role_ids must be array"
                # for exactly one selected role. Leaving this untyped skips
                # that coercion entirely; attachedFiles.ts's
                # extractMultipartRequest already validates/coerces whatever
                # shape multer hands it (array of numeric strings) by hand.
                role_ids: {}
      responses:
        '201':
          description: Uploaded file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachedFile' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

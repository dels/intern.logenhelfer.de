openapi: 3.0.3
info:
  title: Logenhelfer API
  version: 1.0.0
  description: Backend-agnostic contract. Express serves it.
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /api/v1/session:
    post:
      operationId: createSession
      description: >-
        In addition to the per-IP rate limit (see the shared 429 response),
        repeated consecutive failed attempts against the same email lock
        that email out for a period that grows with each further failure,
        independent of source IP. A locked-out attempt returns the identical
        401 `invalid_credentials` body as an ordinary wrong-password
        response - this endpoint never reveals lockout state to the caller.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: >-
            Password verified. The exact body depends on the account's MFA
            state (see mfaLoginResult): a full login (refresh cookie set,
            `access_token`+`user` present) when no MFA method is enrolled
            (or the enrolled-but-unconfigured mandatory-mode grace period
            hasn't ended, or the request carries a trusted-device cookie
            already covering this account); `{ setup_required: true }`
            with no cookie/tokens when MFA is mandatory, the grace period
            has ended, and the user has no method enrolled yet; or
            `{ mfa_pending_token }` with no cookie when a verified method
            exists and must be challenged via
            `/api/v1/mfa/challenge/verify` before a real session is
            issued. The server sets a `refresh_token` cookie scoped to
            path `/api/v1/session`, marked `HttpOnly`, `Secure` (in
            production), `SameSite=Strict`, with a 30-day expiry, only for
            the full-login variant. Any reimplementation of this endpoint
            (e.g. an Express port) must reproduce this cookie contract
            exactly, or the frontend's refresh flow will break silently.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaLoginResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      operationId: deleteSession
      security: []
      responses:
        '204': { description: Logged out; refresh family revoked }
  /api/v1/session/refresh:
    post:
      operationId: refreshSession
      security: []
      responses:
        '200':
          description: >-
            Rotated; new access token. Reads the `refresh_token` cookie
            (name `refresh_token`, path `/api/v1/session`, `HttpOnly`,
            `Secure` in production, `SameSite=Strict`, 30-day TTL) and
            re-sets it with the same attributes on rotation. This cookie
            contract is the backend-coupled seam of the auth flow and must
            be preserved byte-for-byte by any alternative backend
            implementation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPayload' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/session/passkey/options:
    post:
      operationId: getPasskeyLoginOptions
      description: >-
        Passwordless-login step 1: mints a WebAuthn authentication challenge
        (kept in an in-process, TTL-bounded map - see session.ts's
        passkeyLoginChallenges) for the browser's
        navigator.credentials.get(...) call. No account context yet -
        `allowCredentials` is deliberately empty, letting the platform
        authenticator pick from any resident passkey, so this endpoint alone
        never reveals which accounts have passkeys enrolled.
      security: []
      responses:
        '200':
          description: WebAuthn authentication options for the browser
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaWebauthnAuthenticationOptions' }
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/session/passkey/verify:
    post:
      operationId: verifyPasskeyLogin
      description: >-
        Passwordless-login step 2: verifies the browser's
        navigator.credentials.get(...) assertion against the challenge
        minted by getPasskeyLoginOptions and the stored credential's public
        key, then issues a full session exactly like a successful
        password login (refresh cookie set). Every failure mode (missing/
        unknown credential, expired/reused/mismatched challenge, failed
        cryptographic verification) returns the identical 401 body -
        deliberately non-enumerating, matching createSession's own
        contract - so `response` is intentionally left unconstrained here
        rather than `required`, to avoid a contract-validation 400 acting
        as a second, more precise oracle for a malformed vs. merely-wrong
        assertion.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                # Opaque WebAuthn AuthenticationResponseJSON from
                # navigator.credentials.get(...) - forwarded as-is to
                # @simplewebauthn/server's verifyAuthenticationResponse.
                response: { type: object }
      responses:
        '200':
          description: Logged in; refresh cookie set (see createSession's cookie contract)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPayload' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/password/forgot:
    post:
      operationId: forgotPassword
      description: >-
        Always responds 200 with an empty body, whether or not `email`
        matches a real (non-deleted, password-having) account - this
        endpoint never reveals account existence. If it matches, a reset
        link is emailed to that address. If it doesn't, and the
        `notify_technical_contact_on_unknown_password_reset` AppConfig
        toggle is enabled, the technical contact is emailed the address
        that was entered instead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Request accepted (see description - body carries no information).
          content:
            application/json:
              schema: { type: object, additionalProperties: false }
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/password/reset:
    post:
      operationId: resetPassword
      description: >-
        Consumes a single-use reset token (see `forgotPassword`) minted no
        more than `RESET_PASSWORD_TOKEN_TTL` seconds ago (default 3600 - 60
        min). Invalid, expired, and already-used tokens all return the same
        422 body, non-enumerating in the same spirit as `createSession`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password, new_password_confirmation]
              properties:
                token: { type: string }
                new_password: { type: string }
                new_password_confirmation: { type: string }
      responses:
        '200':
          description: Password updated; all outstanding refresh-token families revoked.
          content:
            application/json:
              schema: { type: object, additionalProperties: false }
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/mfa/setup/start:
    post:
      operationId: startMfaSetup
      description: >-
        Starts enrollment of one MFA method. `totp` returns a QR code /
        otpauth URI to scan; `email` sends a one-time code to the caller's
        own address and returns an empty body; `passkey` returns WebAuthn
        registration options for navigator.credentials.create(...). If the
        caller already has ANY verified MFA method, starting a `totp` or
        `passkey` (re-)enrollment additionally requires `proof` of an
        existing method (a fresh TOTP code or a backup code) - `email`
        setup never requires this, since completing it already requires
        inbox access. Requires a full (non-pending) bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [totp, email, passkey] }
                proof:
                  allOf:
                    - $ref: '#/components/schemas/MfaProof'
                  description: Only required when the caller already has a verified method and method is totp or passkey.
      responses:
        '200':
          description: >-
            Shape depends on `method`: MfaSetupStartResult for totp
            (otpauth_uri/qr_code_data_url) and email (empty object), or
            MfaWebauthnRegistrationOptions for passkey.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/MfaSetupStartResult' }
                  - { $ref: '#/components/schemas/MfaWebauthnRegistrationOptions' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/mfa/setup/totp/verify:
    post:
      operationId: verifyMfaTotpSetup
      description: >-
        Confirms a pending TOTP enrollment (from setup/start) with a live
        code. On success, backup codes are generated if the caller doesn't
        already have any (see ensureBackupCodesExist) - `backup_codes` is
        empty on this response when the caller already had codes from an
        earlier method's enrollment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
      responses:
        '200':
          description: TOTP verified and enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaSetupVerifyResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/mfa/setup/email/verify:
    post:
      operationId: verifyMfaEmailSetup
      description: Confirms a pending email-OTP enrollment (from setup/start) with the code just emailed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
      responses:
        '200':
          description: Email OTP verified and enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaSetupVerifyResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/mfa/setup/passkey/verify:
    post:
      operationId: verifyMfaPasskeySetup
      description: Confirms a pending passkey registration (challenge from setup/start) with the browser's navigator.credentials.create(...) response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                name: { type: string, description: 'User-facing label for the credential; defaults to "Passkey" server-side.' }
                # Opaque WebAuthn RegistrationResponseJSON, forwarded as-is
                # to @simplewebauthn/server's verifyRegistrationResponse.
                response: { type: object }
      responses:
        '200':
          description: Passkey registered and enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaSetupVerifyResult' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/mfa/status:
    get:
      operationId: getMfaStatus
      description: Lists the caller's own currently-verified MFA methods.
      responses:
        '200':
          description: Verified methods for the current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaMethodsList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/mfa/backup-codes/regenerate:
    post:
      operationId: regenerateMfaBackupCodes
      description: >-
        Invalidates the caller's existing backup codes and issues a fresh
        set. Requires proof of an existing method - a fresh TOTP code, a
        backup code, or (unlike setup/start's proof gate) a login-purpose-
        adjacent email OTP, since regenerate's threat model is griefing an
        already-verified account, not account persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [totp, backup_code, email, passkey] }
                code: { type: string }
                response: { type: object }
      responses:
        '200':
          description: New backup codes issued; old ones invalidated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaSetupVerifyResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/mfa/methods/passkey/{credentialId}:
    parameters:
      - name: credentialId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeMfaPasskeyCredential
      description: >-
        Removes one of the caller's own passkey credentials by its WebAuthn
        credential id. 404s if the credential doesn't exist or belongs to
        another user (not distinguished, to avoid leaking existence). Same
        proof + last-method-mandatory-block rules as removeMfaMethod.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proof]
              properties:
                proof:
                  $ref: '#/components/schemas/MfaProof'
      responses:
        '204': { description: Passkey credential removed }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/mfa/methods/{type}:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [totp, email] }
    delete:
      operationId: removeMfaMethod
      description: >-
        Removes the caller's own totp or email MFA method. Requires proof of
        an existing verified method (a fresh TOTP code or a backup code),
        via the same verifyExistingMfaProof gate setup/start uses - removal
        is at least as security-sensitive as adding a method. Rejected with
        422 if this would leave the caller with zero methods while mandatory
        MFA's grace period has already passed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proof]
              properties:
                proof:
                  $ref: '#/components/schemas/MfaProof'
      responses:
        '204': { description: Method removed }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/mfa/passkeys:
    get:
      operationId: listMfaPasskeyCredentials
      description: >-
        Lists the caller's own enrolled passkey credentials. Unlike totp/email
        (one row per user), a user may have more than one passkey, so this is
        a list rather than a boolean flag on MfaMethodsList.
      responses:
        '200':
          description: Enrolled passkey credentials for the current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaPasskeyCredentialsList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/mfa/proof/passkey/options:
    post:
      operationId: getMfaProofPasskeyOptions
      description: >-
        Mints a WebAuthn authentication challenge (kept in an in-process,
        per-user map - see mfa.ts's pendingProofChallenges) scoped to the
        caller's own enrolled passkey credentials, for use as `proof` when
        adding/removing another MFA method or regenerating backup codes.
        404s if the caller has no passkey credentials to prove with.
      responses:
        '200':
          description: WebAuthn authentication options, allowCredentials scoped to the caller's own passkeys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaWebauthnAuthenticationOptions' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/mfa/trusted-devices:
    get:
      operationId: listMfaTrustedDevices
      description: Lists the caller's own remembered ("skip MFA challenge on login") devices.
      responses:
        '200':
          description: Trusted devices for the current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaTrustedDevicesList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/mfa/trusted-devices/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    delete:
      operationId: revokeMfaTrustedDevice
      description: Revokes one of the caller's own trusted devices, forcing a full MFA challenge on that device's next login.
      responses:
        '204': { description: Trusted device revoked }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/mfa/challenge/methods:
    get:
      operationId: getMfaChallengeMethods
      description: >-
        Lists the methods available to satisfy an in-progress login
        challenge. Requires the `mfa_pending_token` from createSession's
        200 response (a distinct, narrower-scoped bearer token type - see
        mfaChallenge.ts's requireMfaPendingToken), not a full access token.
      responses:
        '200':
          description: Verified methods available to satisfy this challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaMethodsList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/mfa/challenge/verify:
    post:
      operationId: verifyMfaChallenge
      description: >-
        Completes an in-progress login challenge (see getMfaChallengeMethods)
        with a code for one verified method, issuing a full session on
        success (refresh cookie set) - identical cookie contract to
        createSession. Every failure mode returns the identical 401 body,
        matching createSession's own non-enumerating contract, so `method`/
        `code` are intentionally left unconstrained here rather than
        `required`. Optionally marks the current device as trusted
        (`remember_device: true`), skipping this challenge on that device's
        future logins for a configurable number of days.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [totp, email, backup_code] }
                code: { type: string }
                remember_device: { type: boolean }
      responses:
        '200':
          description: Logged in; refresh cookie (and, if requested, trusted-device cookie) set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionPayload' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/me:
    get:
      operationId: getMe
      responses:
        '200':
          description: Current user and abilities
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, abilities, mfa_setup_required, birthday_calendar_ics_url]
                properties:
                  user: { $ref: '#/components/schemas/MeUser' }
                  abilities:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string, enum: [read, create, update, destroy, index, user_stats, downloads, file_stats, user_file_stats, mem_stats, names_list] }
                  mfa_setup_required: { type: boolean }
                  birthday_calendar_ics_url: { type: string, nullable: true }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/events:
    get:
      operationId: listEvents
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: sort
          in: query
          schema: { type: string, default: date }
        - name: from
          in: query
          description: Inclusive lower bound on event date (YYYY-MM-DD).
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive upper bound on event date (YYYY-MM-DD).
          schema: { type: string, format: date }
      responses:
        '200':
          description: Paginated event list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventList' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/events/{uuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getEvent
      responses:
        '200':
          description: Event with participants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventWithParticipants' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      operationId: deleteEvent
      responses:
        '204': { description: Soft-deleted }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/events/{uuid}/participants:
    parameters:
      - name: uuid
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: registerEventParticipant
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user_uuid: { type: string }
                festive_board: { type: boolean }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventParticipant' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/events/{uuid}/participants/{userUuid}:
    parameters:
      - name: uuid
        in: path
        required: true
        schema: { type: string }
      - name: userUuid
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: removeEventParticipant
      responses:
        '204': { description: Removed }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/events/record_export:
    post:
      operationId: eventsRecordExport
      summary: Record a FileDownload audit row for a PDF-equivalent export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [workingplan_internal] }
      responses:
        '204':
          description: Recorded
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/events/workingplan.pdf:
    get:
      operationId: getInternalWorkingplanPdf
      summary: PDF export of upcoming events (private_description) plus a birthdays page, for authenticated members with the internal_workingplan ability
      responses:
        '200':
          description: PDF export of the internal working plan
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

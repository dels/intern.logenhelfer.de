        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
    BadRequest:
      description: Malformed or missing request parameters
      content:
        application/json:
          schema:
            type: object
            required: [error, detail]
            properties:
              error: { type: string }
              detail: { type: string }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
    NotFound:
      description: No record with that identifier
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            required: [error, detail]
            properties:
              error: { type: string }
              detail: { type: string }
    PayloadTooLarge:
      description: Request body exceeds the allowed size
      content:
        application/json:
          schema:
            type: object
            required: [error, detail]
            properties:
              error: { type: string }
              detail: { type: string }
  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, email, firstname, lastname, subscribed_to_announcements, gdpr_accepted]
      properties:
        id: { type: integer }
        email: { type: string }
        firstname: { type: string, nullable: true }
        lastname: { type: string, nullable: true }
        subscribed_to_announcements: { type: boolean }
        gdpr_accepted: { type: boolean }
    # Flattened rather than `allOf: [User, {...}]` (same reasoning as
    # Member/Event's own "flattened, not allOf" comments elsewhere in this
    # file) - only the /api/v1/me family of endpoints (getMe,
    # updateAnnouncementSubscription, acceptGdpr, updateMyPassword) returns
    # `uuid`, since only those are backed by me.ts's `authJsonFor`, which
    # loads the full `users` row. `SessionPayload.user` (session.ts's login
    # response) deliberately keeps using the plain `User` schema above - its
    # own `authJsonFor` doesn't return `uuid`, and session.ts is out of this
    # task's file boundary, so `User` itself is left unchanged to avoid
    # breaking that contract.
    MeUser:
      type: object
      additionalProperties: false
      required: [id, uuid, email, firstname, lastname, subscribed_to_announcements, gdpr_accepted, birthday_calendar_consent, birthday_calendar_consent_requested]
      properties:
        id: { type: integer }
        uuid: { type: string }
        email: { type: string }
        firstname: { type: string, nullable: true }
        lastname: { type: string, nullable: true }
        subscribed_to_announcements: { type: boolean }
        gdpr_accepted: { type: boolean }
        birthday_calendar_consent: { type: boolean }
        birthday_calendar_consent_requested: { type: boolean }
    SessionPayload:
      type: object
      additionalProperties: false
      required: [access_token, user]
      properties:
        access_token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    MfaMethodsList:
      type: object
      additionalProperties: false
      required: [methods, mode, grace_period_ends_at]
      properties:
        methods:
          type: array
          items: { type: string, enum: [totp, email, passkey] }
        mode: { type: string, enum: [optional, mandatory] }
        grace_period_ends_at: { type: string, format: date-time, nullable: true }
    # Proof of control of an already-verified MFA method, required by
    # setup/start (totp/passkey re-enrollment) and the methods-removal
    # routes - see mfa.ts's verifyExistingMfaProof. `code` is used for
    # totp/backup_code; `response` (an opaque WebAuthn
    # AuthenticationResponseJSON from navigator.credentials.get(...)) is
    # used for passkey. Only `method` is `required` here since the other
    # two are mutually exclusive depending on it - verifyExistingMfaProof
    # itself is the actual authority on which combination is valid.
    MfaProof:
      type: object
      required: [method]
      properties:
        method: { type: string, enum: [totp, backup_code, passkey] }
        code: { type: string }
        response: { type: object }
    MfaSetupStartResult:
      type: object
      additionalProperties: false
      properties:
        otpauth_uri: { type: string }
        qr_code_data_url: { type: string }
    # Raw @simplewebauthn/server `generateRegistrationOptions()` output
    # (POST /mfa/setup/start with method=passkey - see mfaPasskeys.ts's
    # buildRegistrationOptions), passed straight through to the browser's
    # navigator.credentials.create(...) call unmodified. Deliberately NOT
    # `additionalProperties: false` like every other schema in this file -
    # this shape is owned by the @simplewebauthn/server library, not this
    # API, and a future library upgrade adding a field (it already added
    # `hints`/`attestationFormats` across versions) must not break contract
    # validation on a field this API never reads or writes.
    MfaWebauthnRegistrationOptions:
      type: object
      required: [challenge, rp, user, pubKeyCredParams]
      properties:
        challenge: { type: string }
        rp:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            displayName: { type: string }
        pubKeyCredParams:
          type: array
          items:
            type: object
            properties:
              alg: { type: integer }
              type: { type: string }
        timeout: { type: integer }
        attestation: { type: string }
        excludeCredentials:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string }
              transports:
                type: array
                items: { type: string }
        authenticatorSelection:
          type: object
          properties:
            residentKey: { type: string }
            requireResidentKey: { type: boolean }
            userVerification: { type: string }
            authenticatorAttachment: { type: string }
        extensions: { type: object }
        hints:
          type: array
          items: { type: string }
    # Raw @simplewebauthn/server `generateAuthenticationOptions()` output
    # (POST /session/passkey/options - see mfaPasskeys.ts's
    # buildAuthenticationOptions). Same "not additionalProperties: false"
    # reasoning as MfaWebauthnRegistrationOptions above.
    MfaWebauthnAuthenticationOptions:
      type: object
      required: [challenge, allowCredentials]
      properties:
        challenge: { type: string }
        rpId: { type: string }
        allowCredentials:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              type: { type: string }
              transports:
                type: array
                items: { type: string }
        timeout: { type: integer }
        userVerification: { type: string }
        extensions: { type: object }
    MfaSetupVerifyResult:
      type: object
      additionalProperties: false
      required: [backup_codes]
      properties:
        backup_codes:
          type: array
          items: { type: string }
    MfaTrustedDevice:
      type: object
      additionalProperties: false
      required: [id, created_at, expires_at]
      properties:
        id: { type: integer }
        user_agent: { type: string, nullable: true }
        last_ip: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    MfaTrustedDevicesList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items: { $ref: '#/components/schemas/MfaTrustedDevice' }
    MfaPasskeyCredentialsList:
      type: object
      additionalProperties: false
      required: [credentials]
      properties:
        credentials:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [credential_id, name, created_at, last_used_at]
            properties:
              credential_id: { type: string }
              name: { type: string }
              created_at: { type: string, format: date-time }
              last_used_at: { type: string, format: date-time, nullable: true }
    MfaLoginResult:
      type: object
      additionalProperties: false
      properties:
        mfa_pending_token: { type: string }
        setup_required: { type: boolean }
        access_token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    Event:
      type: object
      additionalProperties: false
      required: [uuid, title, date, whole_day, location, created_by_id, created_at, updated_at]
      properties:
        uuid: { type: string }
        title: { type: string }
        date: { type: string, format: date }
        time: { type: string, nullable: true, example: '19:00' }
        end_time: { type: string, nullable: true, example: '22:00' }
        whole_day: { type: boolean }
        location: { type: string, nullable: true }
        public_description: { type: string, nullable: true }
        private_description: { type: string, nullable: true }
        created_by_id: { type: integer }
        updated_by_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EventParticipantSummary:
      type: object
      additionalProperties: false
      required: [uuid, fullname]
      properties:
        uuid: { type: string }
        fullname: { type: string }
    EventParticipant:
      # Distinct from EventParticipantSummary (a different, read-only
      # {uuid, fullname} shape embedded in EventWithParticipants) - this is
      # the write-route response for registerEventParticipant, keyed on
      # user_uuid and with no subscription_confirmed (internal events have
      # no confirm concept, unlike ExternalEventParticipant).
      type: object
      additionalProperties: false
      required: [user_uuid, fullname, festive_board]
      properties:
        user_uuid: { type: string }
        fullname: { type: string }
        festive_board: { type: boolean }
    EventWithParticipants:
      # Flattened rather than `allOf: [Event, {participants}]` - openapi_parser does
      # not enforce a composed schema's top-level `additionalProperties: false`, so
      # an allOf here would silently stop catching a stray top-level field.
      type: object
      additionalProperties: false
      required: [uuid, title, date, whole_day, location, created_by_id, created_at, updated_at, participants]
      properties:
        uuid: { type: string }
        title: { type: string }
        date: { type: string, format: date }
        time: { type: string, nullable: true, example: '19:00' }
        end_time: { type: string, nullable: true, example: '22:00' }
        whole_day: { type: boolean }
        location: { type: string, nullable: true }
        public_description: { type: string, nullable: true }
        private_description: { type: string, nullable: true }
        created_by_id: { type: integer }
        updated_by_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        participants:
          type: array
          items: { $ref: '#/components/schemas/EventParticipantSummary' }
    EventList:
      type: object
      additionalProperties: false
      required: [rows, row_count]
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        row_count: { type: integer }
    PublicEventSummary:
      type: object
      additionalProperties: false
      required: [title, date, whole_day]
      properties:
        title: { type: string }
        location: { type: string, nullable: true }
        public_description: { type: string, nullable: true }
        date: { type: string, format: date }
        whole_day: { type: boolean }
        time: { type: string, nullable: true }
    PublicWorkingplan:
      type: object
      additionalProperties: false
      required: [from, to, rows]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        rows:
          type: array
          items: { $ref: '#/components/schemas/PublicEventSummary' }
    PublicLandingConfig:
      type: object
      additionalProperties: false
      required: [calendar_as_landing_page, lodge, language, logo_version]
      properties:
        calendar_as_landing_page: { type: boolean }
        lodge: { type: string }
        language: { type: string }
        logo_version: { type: integer, nullable: true }
    CustomLogoMeta:
      type: object
      additionalProperties: false
      required: [content_type, updated_at]
      properties:
        content_type: { type: string }
        updated_at: { type: string }
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, demo]
      properties:
        status: { type: string, enum: [ok] }
        revision: { type: string, nullable: true }
        demo: { type: boolean }
    PublicStatus:
      type: object
      additionalProperties: false
      required: [status, revision, uptime_seconds, checks]
      properties:
        status: { type: string, enum: [ok, error] }
        revision: { type: string, nullable: true }
        uptime_seconds: { type: integer }
        checks:
          type: object
          additionalProperties: false
          required: [postgres, redis]
          properties:
            postgres:
              type: object
              additionalProperties: false
              required: [ok, host, port, username, database]
              properties:
                ok: { type: boolean }
                host: { type: string, nullable: true }
                port: { type: integer, nullable: true }
                username: { type: string, nullable: true }
                database: { type: string, nullable: true }
            redis:
              type: object
              additionalProperties: false
              required: [configured, protocol, host, port, username]
              properties:
